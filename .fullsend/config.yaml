# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    # triage agent is customized with a source file
    - name: triage
      source: ./triage.yaml
      model: haiku
    # code agent uses defaults from agents repo; model override below
    - name: code
      model: haiku
    # review agent uses defaults from agents repo; model override below
    - name: review
      model: sonnet
    # fix agent uses defaults from agents repo; model override below
    - name: fix
      model: haiku
    # retro agent uses defaults from agents repo; model override below
    - name: retro
      model: haiku
    # prioritize agent uses defaults from agents repo; model override below
    - name: prioritize
      model: haiku
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - mmnabeel317/orion-mcp
            - fullsend-ai/fullsend
inference:
    project: perf-agentic-fullsend
    wif_provider: projects/138380236330/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-mmnabeel317-orion-mcp
